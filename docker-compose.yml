services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/fueltx
      SPRING_R2DBC_USERNAME: fueltx
      SPRING_R2DBC_PASSWORD: fueltx
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fueltx
      SPRING_DATASOURCE_USERNAME: fueltx
      SPRING_DATASOURCE_PASSWORD: fueltx
      SPRING_ARTEMIS_MODE: native
      SPRING_ARTEMIS_BROKER_URL: tcp://activemq:61616
      SPRING_ARTEMIS_USER: fueltx
      SPRING_ARTEMIS_PASSWORD: fueltx
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      FUELTX_WEBHOOK_SECRET: fueltx-webhook-secret
    depends_on:
      postgres:
        condition: service_healthy
      activemq:
        condition: service_started
      redis:
        condition: service_started

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: fueltx
      POSTGRES_USER: fueltx
      POSTGRES_PASSWORD: fueltx
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fueltx -d fueltx"]
      interval: 5s
      timeout: 5s
      retries: 10

  activemq:
    image: apache/activemq-artemis:2.37.0
    environment:
      ARTEMIS_USER: fueltx
      ARTEMIS_PASSWORD: fueltx
    ports:
      - "61616:61616"
      - "8161:8161"

  redis:
    image: redis:7
    ports:
      - "6379:6379"
